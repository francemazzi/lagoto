name: Import README banner (one-off)

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-readme-banner.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Export staged banner for integrity verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/git/blobs/8594255aa9d153f78c0c9af0dda3b2156a65cadf'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'lagoto-banner-check'})
          with urllib.request.urlopen(req, timeout=30) as response:
              blob = json.load(response)
          data = base64.b64decode(blob['content'])
          pathlib.Path('staged-banner.jpg').write_bytes(data)
          print('STAGED_IMAGE_BYTES=' + str(len(data)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-readme-banner
          path: staged-banner.jpg
          retention-days: 1
          if-no-files-found: error

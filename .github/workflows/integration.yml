name: Native integration
on: [push, pull_request]
jobs:
  gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence freshness compares commits; the full history is needed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - name: Gate in CI mode (typecheck, lint, build, deterministic tests, Swift contracts, XCUITest)
        timeout-minutes: 60
        run: pnpm gate all --ci --ui
      - name: Preserve gate reports and native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            build/evidence/gates
            build/native-ui.json
            build/native-ui.xcresult
          if-no-files-found: warn
      # CI mode reports live and native coverage that needs credentials or the release Mac as blocked.
      # It never marks a phase passed on that basis and never publishes a package.
